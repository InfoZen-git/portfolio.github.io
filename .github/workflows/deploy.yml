name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
      - claude/infozen-portfolio-site-1wmsye
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le base path dépend du nom du dépôt, et le dépôt peut être renommé.
      # On le déduit donc à l'exécution plutôt que de l'écrire en dur :
      # un dépôt <proprietaire>.github.io est servi à la racine, tous les
      # autres sont servis sous /<nom-du-depot>/.
      - name: Déterminer le base path
        id: base
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          repo_lower=$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')
          owner_lower=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')

          if [ "$repo_lower" = "$owner_lower.github.io" ]; then
            printf 'path=/\n' >> "$GITHUB_OUTPUT"
          else
            printf 'path=/%s/\n' "$repo" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build -- --base=${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
